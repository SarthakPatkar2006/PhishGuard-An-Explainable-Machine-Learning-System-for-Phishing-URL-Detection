name: CI/CD Pipeline - Network Security Phishing Detection

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # STAGE 1: Linting, Unit & Integration Tests
  # ==========================================
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm install --legacy-peer-deps react-is
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest flake8

      - name: Code Quality & Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Test Suite
        env:
          GEMINI_API_KEY: "mock-key-for-unit-tests"
        run: |
          python -m pytest tests/ -v

  # ==========================================
  # STAGE 2: Build & Package Docker Container
  # ==========================================
  build-and-push-docker:
    name: Build & Validate Docker Container
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional login if user configured DOCKER_USERNAME & DOCKER_PASSWORD secrets
      - name: Log in to Docker Hub (if secrets configured)
        if: "${{ env.DOCKER_USER != '' && env.DOCKER_PASS != '' }}"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Node.js 20 (for frontend dist artifact)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend Production Dist
        run: |
          cd frontend
          npm install --legacy-peer-deps react-is
          npm run build

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true when DOCKER_USERNAME and DOCKER_PASSWORD secrets are present
          tags: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/network-security-app:latest', secrets.DOCKER_USERNAME) || 'network-security-app:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
