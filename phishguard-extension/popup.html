<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #071322;
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #38bdf8;
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .url-box {
      background: #0f1f35;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      word-break: break-all;
      font-size: 11.5px;
      color: #94a3b8;
    }
    .url-title {
      font-weight: 700;
      color: #cbd5e1;
      font-size: 10.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .btn-scan {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-scan:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    }
    .btn-scan:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result-card {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .result-safe {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }
    .result-phish {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 10.5px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🛡️</span>
      <span>PhishGuard Shield</span>
    </div>
    <div class="badge-live">
      <span class="dot"></span>
      <span>Active</span>
    </div>
  </div>

  <div class="url-title">Current Tab Target</div>
  <div class="url-box" id="current-url-display">Fetching active tab...</div>

  <button class="btn-scan" id="scan-now-btn">
    <span>🔍</span>
    <span>Scan Active Website</span>
  </button>

  <div class="result-card" id="result-box">
    <div style="font-weight: 800; font-size: 14px;" id="result-label">Analyzing...</div>
    <div style="font-size: 11px; margin-top: 6px; opacity: 0.9;" id="result-details"></div>
  </div>

  <div class="footer">
    FastAPI • Random Forest • TreeSHAP • Google Gemini
  </div>

  <script src="popup.js"></script>
</body>
</html>
