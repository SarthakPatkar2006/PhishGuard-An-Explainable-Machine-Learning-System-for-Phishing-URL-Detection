<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ TITLE }}</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --line: #d8dee4;
            --text: #17202a;
            --muted: #607080;
            --primary: #0f766e;
            --primary-dark: #115e59;
            --danger: #b42318;
            --warn: #a15c07;
            --good: #0f766e;
            --ink: #1f2933;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            place-items: center;
            padding: 20px;
            letter-spacing: 0;
        }

        .panel {
            width: min(620px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 22px;
            display: grid;
            gap: 16px;
        }

        h1,
        p {
            margin: 0;
        }

        h1 {
            color: var(--ink);
            font-size: 24px;
            line-height: 1.3;
        }

        .message {
            color: var(--muted);
            line-height: 1.5;
        }

        .detail {
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: #334155;
            padding: 12px;
            font-size: 13px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .badge {
            width: fit-content;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .badge.good {
            background: #e4f5f1;
            color: var(--good);
            border-color: #b7e2d9;
        }

        .badge.warn {
            background: #fff7e8;
            color: var(--warn);
            border-color: #f3d19b;
        }

        .badge.danger {
            background: #fff1f0;
            color: var(--danger);
            border-color: #fac2bd;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            border: 1px solid var(--line);
            border-radius: 6px;
            min-height: 40px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .button.primary:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 520px) {
            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="panel">
        <span class="badge {{ STATUS_CLASS }}">{{ TITLE }}</span>
        <h1>{{ TITLE }}</h1>
        <p class="message">{{ MESSAGE }}</p>
        <p class="detail">{{ DETAIL }}</p>
        <div class="button-row">
            <a class="button primary" href="{{ PRIMARY_ACTION }}">{{ PRIMARY_LABEL }}</a>
            <a class="button" href="{{ SECONDARY_ACTION }}">{{ SECONDARY_LABEL }}</a>
        </div>
    </main>
</body>
</html>
